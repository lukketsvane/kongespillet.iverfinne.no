name: Build Waldo character image archive

on:
  push:
    branches:
      - tmp/waldo-character-images-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download original category images
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, os, re, time, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          API = (
              'https://waldo.fandom.com/api.php?action=query&generator=categorymembers'
              '&gcmtitle=Category%3ACharacter_images&gcmtype=file&gcmlimit=max'
              '&prop=imageinfo&iiprop=url%7Cmime&format=json&formatversion=2'
          )
          OUT = Path('waldo-character-images')
          OUT.mkdir(exist_ok=True)
          UA = 'Mozilla/5.0 (compatible; image-archiver/1.0)'

          req = urllib.request.Request(API, headers={'User-Agent': UA, 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)

          pages = data.get('query', {}).get('pages', [])
          print('Category files:', len(pages))
          if len(pages) < 100:
              raise SystemExit(f'Unexpectedly few category files: {len(pages)}')

          def safe_name(title):
              name = title.removeprefix('File:')
              name = name.replace('/', '_').replace('\\', '_')
              name = re.sub(r'[\x00-\x1f]', '_', name).strip()
              return name or 'unnamed'

          items = []
          seen = set()
          for p in pages:
              info = (p.get('imageinfo') or [{}])[0]
              url = info.get('url')
              if not url:
                  continue
              name = safe_name(p.get('title', 'File:unnamed'))
              base, ext = os.path.splitext(name)
              candidate = name
              n = 2
              while candidate.casefold() in seen:
                  candidate = f'{base}_{n}{ext}'
                  n += 1
              seen.add(candidate.casefold())
              items.append((p.get('title',''), candidate, url, info.get('mime','')))

          def download_one(item):
              title, name, url, api_mime = item
              path = OUT / name
              err = ''
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': UA,
                          'Accept': 'image/png,image/jpeg,image/gif,image/webp,image/*;q=0.9,*/*;q=0.1',
                          'Referer': 'https://waldo.fandom.com/'
                      })
                      with urllib.request.urlopen(req, timeout=90) as r:
                          body = r.read()
                          ctype = (r.headers.get_content_type() or '').lower()
                      if not body or not ctype.startswith('image/'):
                          raise RuntimeError(f'non-image response {ctype}, {len(body)} bytes')
                      path.write_bytes(body)
                      return (name, title, url, 'ok', ctype, len(body), api_mime, '')
                  except Exception as e:
                      err = str(e)
                      time.sleep(1.5 * (attempt + 1))
              return (name, title, url, 'failed', '', 0, api_mime, err)

          rows = []
          with ThreadPoolExecutor(max_workers=8) as ex:
              futs = [ex.submit(download_one, i) for i in items]
              for i, fut in enumerate(as_completed(futs), 1):
                  row = fut.result()
                  rows.append(row)
                  print(f'[{i}/{len(futs)}] {row[3]} {row[0]} {row[5]} bytes')

          rows.sort(key=lambda r: r[0].casefold())
          with open(OUT / 'manifest.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['filename','wiki_title','source_url','status','download_content_type','bytes','api_mime','error'])
              w.writerows(rows)

          ok = sum(r[3] == 'ok' for r in rows)
          failed = len(rows) - ok
          (OUT / 'README.txt').write_text(
              'Waldo Wiki — Category:Character images\n'
              f'Downloaded: {ok} image files\nFailed: {failed}\n'
              'Source category: https://waldo.fandom.com/wiki/Category:Character_images\n'
              'See manifest.csv for source URLs and per-file status.\n',
              encoding='utf-8'
          )
          print(f'DONE: {ok} downloaded, {failed} failed')
          if failed:
              raise SystemExit(f'{failed} image downloads failed')
          PY

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: waldo-character-images
          path: waldo-character-images/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
